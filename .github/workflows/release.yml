name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev dbus-x11 python3-dbus python3-gi desktop-file-utils
      - run: cargo test --locked
      - name: Build AppImage
        run: ./scripts/build-appimage.sh
      - name: Verify packaged tray and startup
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 dbus-run-session -- /usr/bin/python3 scripts/test-private-tray.py dist/Clearwave-x86_64.AppImage
          /usr/bin/python3 scripts/test-autostart-exec.py dist/clearwave
      - name: Package standalone Linux binary and notices
        run: tar -C dist -czf dist/Clearwave-linux-x86_64.tar.gz clearwave LICENSE THIRD_PARTY_NOTICES.md README.md licenses
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/Clearwave-x86_64.AppImage
            dist/Clearwave-linux-x86_64.tar.gz
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum * > SHA256SUMS
          gh release create "$TAG" ./* --title "Clearwave $TAG" --generate-notes
