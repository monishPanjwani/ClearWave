[package]
name = "clearwave"
version = "0.1.2"
edition = "2021"
description = "Linux playback enhancement and microphone cleanup"
license = "MIT"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:image", "tray"]
tray = ["dep:ksni"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3.4", features = ["termination"] }
eframe = { version = "=0.31.1", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
nnnoiseless = { version = "=0.5.2", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
ksni = { version = "=0.3.3", features = ["blocking"], optional = true }

[profile.release]
lto = "thin"
strip = true

