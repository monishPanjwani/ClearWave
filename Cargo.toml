[package]
name = "clearwave"
version = "0.1.0"
edition = "2021"
description = "Local microphone cleanup and audio routing, with a Linux automation CLI"
license = "MIT"

[features]
default = ["gui"]
gui = ["dep:eframe"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ctrlc = { version = "3.4", features = ["termination"] }
eframe = { version = "=0.31.1", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
nnnoiseless = { version = "=0.5.2", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "windows")'.dependencies]
cpal = "=0.15.3"
crossbeam-queue = "0.3"

[profile.release]
lto = "thin"
strip = true

